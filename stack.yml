version: "3.8"

services:
  publisher:
    image: ghcr.io/aadnehovda/swarm-mdns-publisher:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    network_mode: host
    deploy:
      mode: global
      restart_policy:
        condition: any
      placement:
        constraints:
          - node.platform.os == linux
